[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = []

# Somnia Shannon testnet (chain 50312)
[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network"

[etherscan]
somnia_testnet = { key = "${SOMNIA_EXPLORER_KEY}", url = "https://shannon-explorer.somnia.network/api" }
